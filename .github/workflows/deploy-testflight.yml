name: Deploy Kalb-i Selim to TestFlight

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "App Store Connect Bundle ID (Varsayılan: com.kalbiselim.dervis)"
        required: false
        default: "com.kalbiselim.dervis"
  push:
    branches:
      - main

concurrency:
  group: kalbiselim-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application & Sync Capacitor iOS
        run: |
          npm run build
          [ -d ios/App/App.xcodeproj ] || (npx cap add ios --packagemanager SPM || true)
          npx cap sync ios

      - name: Generate 1024x1024 AppIcon, Patch Info.plist & PrivacyInfo.xcprivacy
        run: node scripts/patch-ios.cjs

      - name: Set up Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Deploy to TestFlight via Fastlane
        run: bundle exec fastlane beta
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY: ${{ secrets.APPSTORE_P8_KEY }}
          IOS_DIST_CERT_PEM: ${{ secrets.IOS_DIST_CERT_PEM }}
          IOS_DIST_KEY_PEM: ${{ secrets.IOS_DIST_KEY_PEM }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_BUNDLE_ID: ${{ inputs.bundle_id || 'com.kalbiselim.dervis' }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 8

      - name: Upload Signed KalbiSelim.ipa Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KalbiSelim-Signed-IPA-${{ github.run_number }}
          path: build/KalbiSelim.ipa
          retention-days: 14
